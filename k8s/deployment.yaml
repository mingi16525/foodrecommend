apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodrecommend-api
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: foodrecommend-api
  template:
    metadata:
      labels:
        app: foodrecommend-api
    spec:
      containers:
      - name: foodrecommend-api
        image: registry.example.com/foodrecommend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: foodrecommend-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
