name: CI / Beta Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test (Node.js)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Dependencies
      run: npm install
    - name: Run Linter
      run: npm run lint
    - name: Type Check
      run: npx tsc --noEmit
    - name: Run Tests
      run: npm test

  frontend-build-android:
    name: Frontend Build (Android APK)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64
    - name: Install Flutter Dependencies
      # NOTE: Do NOT run 'flutter create .' here — it re-generates files and
      # triggers a file-watcher conflict ("Already watching path") that causes
      # Flutter to lose track of the APK after Gradle builds it.
      run: flutter pub get
      working-directory: ./frontend
    - name: Accept Android SDK licenses
      run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
    - name: Build Android APK
      run: flutter build apk --release --no-tree-shake-icons
      working-directory: ./frontend
    - name: Find generated APK (debug)
      if: always()
      run: find frontend/build -name "*.apk" 2>/dev/null || echo "No APK found"
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: food-recommend-beta-apk
        path: frontend/build/app/outputs/flutter-apk/app-release.apk
